<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1A38" />
    <meta name="application-name" content="425service" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="425service" />
    <meta name="description" content="425service — โปรแกรมซ่อมบำรุง" />

    <title>%WEB_TITLE%</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #0f1a38;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <style id="pwa-splash-css">
      #pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse 90% 55% at 50% 38%, #243b6b 0%, transparent 62%),
          radial-gradient(ellipse 70% 40% at 50% 100%, rgba(201, 162, 39, 0.12) 0%, transparent 55%),
          #0f1a38;
        color: #f2f4fa;
        font-family: 'Sukhumvit Set', 'Thonburi', 'Tahoma', sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 420ms cubic-bezier(0.7, 0, 0.84, 0), visibility 420ms;
      }
      #pwa-splash.is-hiding {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #pwa-splash .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(88vw, 420px);
        padding: 24px;
        text-align: center;
      }
      #pwa-splash .splash-wordmark {
        width: min(100%, 340px);
        height: auto;
        aspect-ratio: 858 / 291;
        object-fit: contain;
        mix-blend-mode: screen;
        opacity: 0;
        transform: translateY(12px);
        animation: splash-in 780ms cubic-bezier(0.16, 1, 0.3, 1) 80ms forwards;
      }
      #pwa-splash .splash-rule {
        width: 48px;
        height: 2px;
        margin: 22px 0 14px;
        border-radius: 999px;
        background: #c9a227;
        transform: scaleX(0);
        transform-origin: center;
        animation: splash-rule 560ms cubic-bezier(0.16, 1, 0.3, 1) 380ms forwards;
      }
      #pwa-splash .splash-product {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: rgba(242, 244, 250, 0.92);
        opacity: 0;
        transform: translateY(8px);
        animation: splash-in 700ms cubic-bezier(0.16, 1, 0.3, 1) 420ms forwards;
      }
      #pwa-splash .splash-tag {
        margin: 8px 0 0;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: rgba(201, 162, 39, 0.95);
        opacity: 0;
        transform: translateY(8px);
        animation: splash-in 700ms cubic-bezier(0.16, 1, 0.3, 1) 500ms forwards;
      }
      #pwa-splash .splash-bar {
        width: 120px;
        height: 2px;
        margin-top: 28px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        opacity: 0;
        animation: splash-in 500ms cubic-bezier(0.16, 1, 0.3, 1) 620ms forwards;
      }
      #pwa-splash .splash-bar > span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #c9a227;
        animation: splash-bar 1.1s cubic-bezier(0.65, 0, 0.35, 1) 700ms infinite;
      }
      @keyframes splash-in {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes splash-rule {
        to {
          transform: scaleX(1);
        }
      }
      @keyframes splash-bar {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #pwa-splash .splash-wordmark,
        #pwa-splash .splash-product,
        #pwa-splash .splash-tag,
        #pwa-splash .splash-bar {
          animation: none;
          opacity: 1;
          transform: none;
        }
        #pwa-splash .splash-rule {
          animation: none;
          transform: none;
        }
        #pwa-splash .splash-bar > span {
          animation: none;
          width: 100%;
          opacity: 0.55;
        }
      }
    </style>
  </head>

  <body>
    <div id="pwa-splash" role="status" aria-live="polite" aria-label="กำลังเปิด 425service">
      <div class="splash-inner">
        <img
          class="splash-wordmark"
          src="/splash-wordmark.png"
          width="340"
          height="115"
          alt="425service"
        />
        <div class="splash-rule" aria-hidden="true"></div>
        <p class="splash-product">425service</p>
        <p class="splash-tag">โปรแกรมซ่อมบำรุง</p>
        <div class="splash-bar" aria-hidden="true"><span></span></div>
      </div>
    </div>

    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
    <script>
      (function () {
        var splash = document.getElementById('pwa-splash');
        var shownAt = Date.now();
        var minMs = 720;
        var maxMs = 3200;
        var hidden = false;

        function hideSplash() {
          if (hidden || !splash) return;
          hidden = true;
          splash.classList.add('is-hiding');
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 450);
        }

        window.__hidePwaSplash = function () {
          var wait = Math.max(0, minMs - (Date.now() - shownAt));
          setTimeout(hideSplash, wait);
        };

        setTimeout(function () {
          if (!hidden) window.__hidePwaSplash();
        }, maxMs);

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker
              .register('/sw.js')
              .then(function (reg) {
                // ดึง sw.js ใหม่เร็วขึ้นหลัง deploy (แก้เคสดัก API แล้วได้ HTML)
                if (reg && typeof reg.update === 'function') reg.update();
              })
              .catch(function () {});
          });
        }
      })();
    </script>
  </body>
</html>
